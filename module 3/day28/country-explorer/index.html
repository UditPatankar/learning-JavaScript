<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Country Explorer</title>
  <!-- Scripts -->
  <script defer src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script defer src="sample-data.js"></script>
  <script defer src="config.js"></script>
  <script defer type="module" src="app.js"></script>
  
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">  
  <!-- Leaflet CSS (for Map) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- HEADER -->
  <header class="app-header">
    <div class="container header-container">
      <h1 class="logo">Where in the world?</h1>
      <button id="theme-toggle-btn" class="theme-toggle">
        <i class="fa-regular fa-moon"></i>
        <span>Dark Mode</span>
      </button>
    </div>
  </header>

  <!-- MAIN CONTENT CONTAINER -->
  <main class="container">
    
    <!-- SEARCH & FILTER CONTROLS -->
    <section class="controls-section">
      <div class="search-box">
        <i class="fa-solid fa-magnifying-glass search-icon"></i>
        <input type="text" id="search-input" placeholder="Search for a country...">
      </div>

      <div class="filter-box">
        <select id="region-filter">
          <option value="">Filter by Region</option>
          <option value="africa">Africa</option>
          <option value="americas">Americas</option>
          <option value="asia">Asia</option>
          <option value="europe">Europe</option>
          <option value="oceania">Oceania</option>
        </select>
      </div>
    </section>

   <!-- STATUS MESSAGE CONTAINER (Insert above #countries-grid) -->
   <div id="status-message" class="status-message hidden"></div>

    <!-- COUNTRIES GRID -->
    <section id="countries-grid" class="countries-grid">
      <!-- Dynamic country cards will be rendered here -->
    </section>

  </main>

  <!-- DETAIL MODAL OVERLAY -->
  <div id="detail-modal" class="modal-overlay hidden">
    <div class="modal-content">
      <button id="back-btn" class="btn-back">
        <i class="fa-solid fa-arrow-left"></i> Back
      </button>

      <div class="modal-grid">
        <div class="modal-flag-container">
          <img id="modal-flag" src="" alt="Country Flag" class="modal-flag">
        </div>

        <div class="modal-text-content">
          <h2 id="modal-name"></h2>
          
          <div class="modal-info-columns">
            <div class="info-col">
              <p><strong>Official Name:</strong> <span id="modal-official-name"></span></p>
              <p><strong>Population:</strong> <span id="modal-population"></span></p>
              <p><strong>Region:</strong> <span id="modal-region"></span></p>
              <p><strong>Sub Region:</strong> <span id="modal-subregion"></span></p>
              <p><strong>Capital:</strong> <span id="modal-capital"></span></p>
            </div>
            
            <div class="info-col">
              <p><strong>Top Level Domain:</strong> <span id="modal-tld"></span></p>
              <p><strong>Currencies:</strong> <span id="modal-currencies"></span></p>
              <p><strong>Languages:</strong> <span id="modal-languages"></span></p>
            </div>
          </div>

          <div class="border-countries-container">
            <strong>Border Countries:</strong>
            <div id="modal-borders" class="border-countries">
              <!-- Border buttons appended dynamically -->
            </div>
          </div>
        </div>
      </div>

      <!-- MAP CONTAINER -->
      <div id="map-container"></div>
    </div>
  </div>

  <!-- CARD TEMPLATE FOR JS CLONING -->
  <template id="card-template">
    <article class="country-card">
      <div class="card-flag">
        <img src="" alt="">
      </div>
      <div class="card-body">
        <h2 class="country-name"></h2>
        <div class="card-details"></div>
      </div>
    </article>
  </template>
</body>
</html>
