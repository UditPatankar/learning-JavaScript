<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Movie Search App</title>
   <link rel="stylesheet" href="style.css">
   <script defer src="logic.js"></script>
</head>
<body>

   <h1>Movie Explorer</h1>

   <div id="container" class="container">
      <!-- Search Input Section -->
      <div id="search-section" class="search-section">
         <input type="text" id="search-box" class="search-box" placeholder="Search for a movie...">
         <button id="search-btn" class="search-btn">Search</button>
      </div>

      <!-- Movie Results Grid -->
      <div id="movies-container" class="movies-container">
      </div>

      <!-- Movie Card Template --> 
      <template id="card-template">
         <div class="card">
            <img class="poster" src="" alt="Movie Poster">
            <div class="title"></div>
            <div class="type"></div>
            <div class="year"></div>
         </div>
      </template>

      <!-- Error / Not Found Message -->
      <div id="not-found" class="not-found hide"></div>
   </div>

</body>
</html>
