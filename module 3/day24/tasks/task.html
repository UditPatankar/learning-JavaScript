<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Day 24 task</title>
</head>
<body>
   <h1>Day 24 Tasks</h1>

   <script>
      // 1. Create a function wait(ms) that returns a promise which resolves after ms milliseconds. Use async/await to log messages before and after the delay
      function wait(ms) {
         return new Promise((resolve) => {
            setTimeout(() => resolve(), ms);
         })
      }
      (async () => {
         console.log("before the delay");
         await wait(4000);
         console.log("after the delay");
      })();
      // 2. Using async/await, log "One", then after 1 second log "Two", then "Three" after another 2 seconds. No setTimeout outside of promises
      function delay(ms) {
         return new Promise((resolve) => {
            setTimeout(resolve, ms);
         })
      }
      (async () => {
         console.log("One");
         await delay(1000);
         console.log("Two");
         await delay(2000);
         console.log("Three");
      })();
      // 3. Use fetch() with async/await to load a local JSON file (data.json) and display its contents in the console
      async function loadLocalData() {
         try {
            const response = await fetch('data.json');
            if(!response.ok) throw new Error("HTTP error! Status", response.status);
            const data = await response.json();
            console.log(data);
         }
         catch(err) {
            console.error("failed to load the data.json:", error);
         }
      }
      setTimeout(loadLocalData, 5000);
      // 4. Use the public API https://jsonplaceholder.typicode.com/users/1 to fetch and display the user’s name, email, and address on console.
      async function getUser() {
         try{
            const response = await fetch("https://jsonplaceholder.typicode.com/users/1");
            if(!response.ok) throw new Error("HTTP error! Status", response.status);
            const data = await response.json();
            console.log("User name:", data?.name);
            console.log("User email:", data?.email);
            console.log(`User address:, ${data?.address.street}, ${data?.address.suite}, ${data?.address.city}`);
         }
         catch(err) {
            console.error("Failed to get user data", err.message);
         }
      }
      setTimeout(getUser, 6000);

      // 5. Modify the previous task to handle errors (e.g., wrong URL) and display a user-friendly error message in the console
      async function getUserWithBetterErrors() {
         const wrongUrl = "https://typicode.com";
         try {
            const response = await fetch(wrongUrl);
            // Handles 404 (Not Found) or 500 (Server Error)
            if (!response.ok) {
               if (response.status === 404) {
                  throw new Error("The requested user could not be found (404).");
               }
               throw new Error(`Server returned an error status: ${response.status}`);
            }
            
            const data = await response.json();
            console.log("User name:", data?.name);
         } catch (err) {
            console.error("⚠️ User-Friendly Error Message:");
            if (err instanceof TypeError) {
               console.error("Unable to connect to the server. Please check the URL or your internet connection.");
            } else {
               console.error(err.message);
            }
         }
      }
      setTimeout(getUserWithBetterErrors, 7000);

      // 6. Refactor then/catch to async/await
      // fetch('/api/data')
      // .then(res => res.json())
      // .then(data => console.log(data))
      // .catch(err => console.error(err));
      async function fetchData() {
         try {
            const res = await fetch('/api/data');
            if(!res.ok) throw new Error("error occurred!");
            const data = await res.json();
            console.log(data);
         }
         catch(err) {
            console.error(err.message);
         }
      };
      setTimeout(fetchData, 8000);
   </script>
</body>
</html>
