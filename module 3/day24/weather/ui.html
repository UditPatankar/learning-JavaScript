<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Weather App</title>
   <link rel="stylesheet" href="style.css">
   <script defer src="logic.js"></script>
</head>
<body>
   <h1>Weather App</h1>
   <div id="container" class="container">
      <div id="search-section" class="search-section">
         <input type="text" id="search-box" class="search-box" placeholder="Search City...">
         <button id="search-btn" class="search-btn">Get Weather</button>
      </div>
      <div id="weather-detail-section" class="weather-detail-section">
         <div id="city" class="city"></div>
         <div id="temp" class="temp"></div>
         <div id="description" class="description"></div>
      </div>

      <div id="not-found" class="not-found"></div>
   </div>
</body>
</html>
