<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Toggle Theme</title>
   <script defer src="logic.js"></script>
   <style>
      body{
         background-color: whitesmoke;
         color: #333;
         font-family: Arial, Helvetica, sans-serif;
      }
      .dark-theme {
         background-color: #333;
         color: #fff
      }

      .light-theme {
         background-color: whitesmoke;
         color: #333
      }

      button {
         border: 4px solid silver;
         border-radius: 10px;
         padding: 10px;
         font-size: 1rem;
         cursor: pointer;
         background-color: #333;
         color: #fff
      }
      button:active {
         opacity: 0.8;
      }
   </style>
</head>
<body>
   <h1>Hey Welcome to theme toggle app :)</h1>
   <p>You can toggle the theme using the button below.</p>
   <p id="info">I am Light theme:)</p>
   <button id="toggleBtn">Toggle Theme</button>
</body>
</html>
